name: CI/CD - Despliegue Automático en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos para escribir en la rama gh-pages con el token del repositorio
permissions:
  contents: write

concurrency:
  group: 'github-pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación (Build)
        run: npm run build

      - name: Soporte para rutas SPA (copiar index.html a 404.html y crear .nojekyll)
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: "ci(deploy): actualización automática desde main [skip ci]"
